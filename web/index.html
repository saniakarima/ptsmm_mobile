<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Aplikasi Mobile Resmi PT Shafa Marwa Multiguna (PT SMM) Way Halim, Bandar Lampung. Katalog 16 Produk Pilihan, Pemesanan Online, Lacak Pengiriman Biteship, Karir, dan Dashboard Admin.">
  <meta name="theme-color" content="#090E17">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT SMM Mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PT Shafa Marwa Multiguna - Mobile Web</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #090E17;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #162A45 0%, #090E17 100%);
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner-ring {
      width: 50px;
      height: 50px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #E2E8F0;
      margin-bottom: 6px;
    }
    .loading-subtitle {
      font-size: 12px;
      color: #94A3B8;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner-ring"></div>
    <div class="loading-title">PT SHAFA MARWA MULTIGUNA</div>
    <div class="loading-subtitle">Memuat Aplikasi Mobile...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
